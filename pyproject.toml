[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitenv"
version = "4.0.0"
description = "RL environment and benchmark for candidate pipeline triage, with a counterfactual fairness audit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "numpy",
]

[project.optional-dependencies]
# OpenEnv server and typed client (the Space runs this)
openenv = ["openenv>=0.14,<0.15", "uvicorn"]
# Model-backed agents: inference.py, baseline/run_baseline.py, scripts/run_benchmark.py
agents = ["openai", "python-dotenv"]
dev = ["pytest", "httpx", "websockets"]

[project.scripts]
recruitenv-server = "recruitenv.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["recruitenv*"]
